<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直采饱和度分析 - 7.15 vs 7.29</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f1f4f8;--surface:#fff;--text:#1e293b;--border:#e2e8f0;--primary:#2563eb;--accent-green:#059669;--accent-red:#dc2626;--shadow-sm:0 1px 3px rgba(0,0,0,.05)}
body{font-family:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;margin:0;padding:20px}
.header{background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#fff;padding:18px 28px;border-radius:12px;margin-bottom:20px}
.header h1{font-size:1.3rem;font-weight:700;margin:0}
.header p{font-size:.82rem;opacity:.7;margin:4px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border-radius:12px;padding:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.card h2{font-size:1rem;font-weight:700;margin:0 0 16px;color:var(--text)}
.chart-wrap{position:relative;height:320px}
.chart-wrap canvas{width:100%!important}
.full{grid-column:1/-1}
.table-wrap{overflow-x:auto;max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:.82rem}
thead th{background:#f8fafc;position:sticky;top:0;z-index:2;padding:10px 8px;text-align:center;border-bottom:2px solid var(--border);font-weight:600;font-size:.78rem;white-space:nowrap}
tbody td{padding:7px 8px;text-align:center;border-bottom:1px solid #f0f0f0}
tbody tr:nth-child(even){background:#fafbfc}
tbody tr:hover{background:#f0f4ff}
.text-left{text-align:left!important}
.text-right{text-align:right!important}
.rate-bad{color:var(--accent-red);font-weight:700}
.rate-warn{color:#ea580c;font-weight:700}
.rate-good{color:var(--accent-green);font-weight:700}
.legend{display:flex;gap:16px;margin-top:10px;font-size:.78rem;color:#64748b}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend span::before{content:'';width:12px;height:12px;border-radius:3px;display:inline-block}
.legend .l715::before{background:#9ca3af}
.legend .l729::before{background:#ea580c}
</style>
</head>
<body>

<div class="header">
  <h1>📊 直采饱和度分析</h1>
  <p>7.15期 vs 7.29期 ｜ 全量低边际成本专柜</p>
</div>

<div class="grid">
  <div class="card full">
    <h2>📈 各战区饱和度对比（7.15 vs 7.29）</h2>
    <div class="chart-wrap"><canvas id="regionChart"></canvas></div>
    <div class="legend">
      <span class="l715">7.15期饱和度</span>
      <span class="l729">7.29期饱和度</span>
    </div>
  </div>
  <div class="card full">
    <h2>📍 全量门店饱和度排名（7.29期 · 低→高）</h2>
    <div class="table-wrap" id="storeTable"></div>
  </div>
</div>

<script>
// ==================== EMBEDDED DATA ====================
const REGION_DATA = {"第一战区A":{"7.15":0.0857,"7.29":0.0912},"第一战区B":{"7.15":0.1184,"7.29":0.2829},"第七战区":{"7.15":0.0802,"7.29":0.0583},"第三战区":{"7.15":0.1323,"7.29":0.1362},"第九战区":{"7.15":0.1221,"7.29":0.0782},"第二战区":{"7.15":0.2442,"7.29":0.1782},"第八战区":{"7.15":0.1772,"7.29":0.1946},"第六战区":{"7.15":0.0856,"7.29":0.2023}};

const STORE_DATA = [{"region":"第二战区","store":"宁波东门银泰百货","counterCount":1,"sumQ":16128,"sumR":36,"saturation":0.0022},{"region":"第九战区","store":"荆门银泰百货","counterCount":1,"sumQ":1260,"sumR":3,"saturation":0.0024},{"region":"第六战区","store":"金华江北银泰百货","counterCount":2,"sumQ":15254,"sumR":298,"saturation":0.0195},{"region":"第七战区","store":"西安曲江银泰百货","counterCount":1,"sumQ":48000,"sumR":1067,"saturation":0.0222},{"region":"第三战区","store":"芜湖银泰百货","counterCount":2,"sumQ":7488,"sumR":401,"saturation":0.0536},{"region":"第七战区","store":"宝鸡开元商城","counterCount":1,"sumQ":16000,"sumR":944,"saturation":0.059},{"region":"第九战区","store":"银泰百货武汉创意城","counterCount":4,"sumQ":21264,"sumR":1303,"saturation":0.0613},{"region":"第六战区","store":"温州世贸银泰百货","counterCount":5,"sumQ":720,"sumR":48,"saturation":0.0667},{"region":"第九战区","store":"孝感银泰百货","counterCount":1,"sumQ":4032,"sumR":288,"saturation":0.0714},{"region":"第一战区A","store":"杭州之江银泰百货","counterCount":3,"sumQ":12770,"sumR":918,"saturation":0.0719},{"region":"第一战区B","store":"杭州中大银泰百货","counterCount":2,"sumQ":8748,"sumR":757,"saturation":0.0865},{"region":"第一战区A","store":"杭州庆春银泰百货","counterCount":4,"sumQ":5336,"sumR":463,"saturation":0.0868},{"region":"第二战区","store":"宁波环球银泰百货","counterCount":7,"sumQ":46144,"sumR":4663,"saturation":0.1011},{"region":"第三战区","store":"蚌埠银泰百货","counterCount":2,"sumQ":21600,"sumR":2443,"saturation":0.1131},{"region":"第三战区","store":"合肥滨湖银泰百货","counterCount":2,"sumQ":5440,"sumR":5538,"saturation":1.018},{"region":"第八战区","store":"海宁银泰百货","counterCount":4,"sumQ":3910,"sumR":2165,"saturation":0.5537},{"region":"第一战区A","store":"杭州西湖银泰百货","counterCount":2,"sumQ":2100,"sumR":931,"saturation":0.4433},{"region":"第八战区","store":"嘉善银泰百货","counterCount":2,"sumQ":2205,"sumR":1619,"saturation":0.7342},{"region":"第八战区","store":"杭州下沙银泰百货","counterCount":3,"sumQ":11350,"sumR":1367,"saturation":0.1204},{"region":"第六战区","store":"乐清银泰百货","counterCount":8,"sumQ":9445,"sumR":1179,"saturation":0.1248},{"region":"第六战区","store":"温州瓯海银泰百货","counterCount":6,"sumQ":10572,"sumR":1408,"saturation":0.1332},{"region":"第六战区","store":"厦门集美银泰百货","counterCount":4,"sumQ":3456,"sumR":576,"saturation":0.1667},{"region":"第八战区","store":"莲荷里","counterCount":4,"sumQ":5440,"sumR":964,"saturation":0.1772},{"region":"第六战区","store":"临海银泰百货","counterCount":3,"sumQ":12234,"sumR":2223,"saturation":0.1817},{"region":"第三战区","store":"合肥高新银泰百货","counterCount":6,"sumQ":42980,"sumR":8196,"saturation":0.1907},{"region":"第八战区","store":"杭州萧山银泰百货","counterCount":5,"sumQ":4648,"sumR":940,"saturation":0.2022},{"region":"第八战区","store":"湖州东吴银泰百货","counterCount":4,"sumQ":7736,"sumR":1593,"saturation":0.2059},{"region":"第六战区","store":"温岭银泰百货","counterCount":4,"sumQ":17796,"sumR":4234,"saturation":0.2379},{"region":"第一战区A","store":"杭州文化银泰百货","counterCount":2,"sumQ":74500,"sumR":17820,"saturation":0.2392},{"region":"第八战区","store":"杭州滨江银泰百货","counterCount":2,"sumQ":18034,"sumR":4780,"saturation":0.2651},{"region":"第六战区","store":"金华之心银泰百货","counterCount":1,"sumQ":1500,"sumR":415,"saturation":0.2767},{"region":"第六战区","store":"义乌银泰百货","counterCount":2,"sumQ":2400,"sumR":704,"saturation":0.2933},{"region":"第六战区","store":"厦门国贸银泰百货","counterCount":1,"sumQ":1920,"sumR":623,"saturation":0.3245},{"region":"第六战区","store":"柳州银泰百货","counterCount":2,"sumQ":10692,"sumR":3821,"saturation":0.3574},{"region":"第八战区","store":"绍兴银泰百货","counterCount":2,"sumQ":1980,"sumR":756,"saturation":0.3818},{"region":"第七战区","store":"宝鸡银泰百货","counterCount":2,"sumQ":7920,"sumR":3152,"saturation":0.398}];

// ==================== REGION CHART ====================
const regions = Object.keys(REGION_DATA).sort();
const labels = regions;
const d715 = regions.map(r => (REGION_DATA[r]['7.15']*100).toFixed(1));
const d729 = regions.map(r => (REGION_DATA[r]['7.29']*100).toFixed(1));

const ctx = document.getElementById('regionChart').getContext('2d');
new Chart(ctx, {
  type: 'bar',
  data: {
    labels: labels,
    datasets: [
      { label: '7.15期', data: d715, backgroundColor: '#9ca3af', borderRadius: [0,0,4,4], barPercentage: 0.6, categoryPercentage: 0.8 },
      { label: '7.29期', data: d729, backgroundColor: '#ea580c', borderRadius: [4,4,0,0], barPercentage: 0.6, categoryPercentage: 0.8 }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: function(ctx) { return ctx.dataset.label + ': ' + ctx.raw + '%'; }
        }
      }
    },
    scales: {
      y: {
        beginAtZero: true,
        max: 35,
        ticks: { callback: function(v) { return v + '%'; }, stepSize: 5 },
        grid: { color: '#f0f0f0' }
      },
      x: { grid: { display: false } }
    },
    animation: { duration: 800 },
    onComplete: function() {} // placehold for datalabels
  },
  plugins: [{
    id: 'datalabels',
    afterDatasetsDraw: function(chart) {
      var chartCtx = chart.ctx;
      chart.data.datasets.forEach(function(ds, di) {
        var meta = chart.getDatasetMeta(di);
        meta.data.forEach(function(bar, i) {
          var val = ds.data[i];
          chartCtx.fillStyle = di === 0 ? '#6b7280' : '#c2410c';
          chartCtx.font = 'bold 11px Inter,PingFang SC,sans-serif';
          chartCtx.textAlign = 'center';
          chartCtx.textBaseline = 'bottom';
          chartCtx.fillText(val + '%', bar.x, bar.y - 4);
        });
      });
    }
  }]
});

// ==================== STORE TABLE ====================
function fmtNum(n,d){if(n==null||isNaN(n))return'-';return n.toLocaleString('zh-CN',{minimumFractionDigits:d||0});}
function pctHtml(n){if(n==null)return'-';const p=(n*100).toFixed(1)+'%';let c='rate-bad';if(n>=0.4)c='rate-good';else if(n>=0.1)c='rate-warn';return '<span class=\"'+c+'\">'+p+'</span>';}

let th = '<table><thead><tr><th>排名</th><th>战区</th><th>门店</th><th>专柜数</th><th>饱和承接人数(Q)</th><th>实际核销(R)</th><th>饱和度</th></tr></thead><tbody>';
STORE_DATA.forEach((s,i) => {
  th += '<tr><td>'+(i+1)+'</td><td class=\"text-left\">'+s.region+'</td><td class=\"text-left\"><strong>'+s.store+'</strong></td><td>'+s.counterCount+'</td><td class=\"text-right\">'+fmtNum(s.sumQ,0)+'</td><td class=\"text-right\">'+fmtNum(s.sumR,0)+'</td><td>'+pctHtml(s.saturation)+'</td></tr>';
});
th += '</tbody></table>';
document.getElementById('storeTable').innerHTML = th;
</script>
</body>
</html>
