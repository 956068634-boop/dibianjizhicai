<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直采饱和度分析 - 7.15 vs 7.29</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f1f4f8;--surface:#fff;--text:#1e293b;--border:#e2e8f0;--primary:#2563eb;--accent-green:#059669;--accent-red:#dc2626;--shadow-sm:0 1px 3px rgba(0,0,0,.05)}
body{font-family:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;margin:0;padding:20px}
.header{background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#fff;padding:18px 28px;border-radius:12px;margin-bottom:20px}
.header h1{font-size:1.3rem;font-weight:700;margin:0}
.header p{font-size:.82rem;opacity:.7;margin:4px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border-radius:12px;padding:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.card h2{font-size:1rem;font-weight:700;margin:0 0 16px;color:var(--text)}
.chart-wrap{position:relative;height:320px}
.chart-wrap canvas{width:100%!important}
.full{grid-column:1/-1}
.table-wrap{overflow-x:auto;max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:.82rem}
thead th{background:#f8fafc;position:sticky;top:0;z-index:2;padding:10px 8px;text-align:center;border-bottom:2px solid var(--border);font-weight:600;font-size:.78rem;white-space:nowrap}
tbody td{padding:7px 8px;text-align:center;border-bottom:1px solid #f0f0f0}
tbody tr:nth-child(even){background:#fafbfc}
tbody tr:hover{background:#f0f4ff}
.text-left{text-align:left!important}
.text-right{text-align:right!important}
.rate-bad{color:var(--accent-red);font-weight:700}
.rate-warn{color:#ea580c;font-weight:700}
.rate-good{color:var(--accent-green);font-weight:700}
.legend{display:flex;gap:16px;margin-top:10px;font-size:.78rem;color:#64748b}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend span::before{content:'';width:12px;height:12px;border-radius:3px;display:inline-block}
.legend .l715::before{background:#9ca3af}
.legend .l729::before{background:#ea580c}
.btn-dl{float:right;padding:6px 14px;border:1.5px solid #d0d5dd;border-radius:6px;background:#fff;font-size:.8rem;cursor:pointer;font-weight:500;color:#555}
.btn-dl:hover{background:#f0f4ff;border-color:var(--primary);color:var(--primary)}
</style>
</head>
<body>

<div class="header">
  <h1>📊 直采饱和度分析</h1>
  <p>7.15期 vs 7.29期 ｜ 全量低边际成本专柜</p>
</div>

<div class="grid">
  <div class="card full">
    <h2>📈 各战区饱和度对比（7.15 vs 7.29）</h2>
    <div class="chart-wrap"><canvas id="regionChart"></canvas></div>
    <div class="legend">
      <span class="l715">7.15期饱和度</span>
      <span class="l729">7.29期饱和度</span>
    </div>
  </div>
  <div class="card full">
    <h2>📍 全量门店饱和度排名（7.29期 · 低→高）<button class="btn-dl" onclick="downloadCSV()">📥 下载CSV</button></h2>
    <div class="table-wrap" id="storeTable"></div>
  </div>
</div>

<script>
// ==================== EMBEDDED DATA ====================

滨湖银泰百货","counterCount":2,"sumQ":5440,"sumR":5538,"saturation":1.018014705882353}];

// ==================== REGION CHART ====================
const regions = Object.keys(REGION_DATA).sort();
const labels = regions;
const d715 = regions.map(r => (REGION_DATA[r]['7.15']*100).toFixed(1));
const d729 = regions.map(r => (REGION_DATA[r]['7.29']*100).toFixed(1));

const ctx = document.getElementById('regionChart').getContext('2d');
new Chart(ctx, {
  type: 'bar',
  data: {
    labels: labels,
    datasets: [
      { label: '7.15期', data: d715, backgroundColor: '#9ca3af', borderRadius: [0,0,4,4], barPercentage: 0.6, categoryPercentage: 0.8 },
      { label: '7.29期', data: d729, backgroundColor: '#ea580c', borderRadius: [4,4,0,0], barPercentage: 0.6, categoryPercentage: 0.8 }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: function(ctx) { return ctx.dataset.label + ': ' + ctx.raw + '%'; }
        }
      }
    },
    scales: {
      y: {
        beginAtZero: true,
        max: 35,
        ticks: { callback: function(v) { return v + '%'; }, stepSize: 5 },
        grid: { color: '#f0f0f0' }
      },
      x: { grid: { display: false } }
    },
    animation: { duration: 800 },
    onComplete: function() {} // placehold for datalabels
  },
  plugins: [{
    id: 'datalabels',
    afterDatasetsDraw: function(chart) {
      var chartCtx = chart.ctx;
      chart.data.datasets.forEach(function(ds, di) {
        var meta = chart.getDatasetMeta(di);
        meta.data.forEach(function(bar, i) {
          var val = ds.data[i];
          chartCtx.fillStyle = di === 0 ? '#6b7280' : '#c2410c';
          chartCtx.font = 'bold 11px Inter,PingFang SC,sans-serif';
          chartCtx.textAlign = 'center';
          chartCtx.textBaseline = 'bottom';
          chartCtx.fillText(val + '%', bar.x, bar.y - 4);
        });
      });
    }
  }]
});

// ==================== STORE TABLE ====================
function fmtNum(n,d){if(n==null||isNaN(n))return'-';return n.toLocaleString('zh-CN',{minimumFractionDigits:d||0});}
function pctHtml(n){if(n==null)return'-';const p=(n*100).toFixed(1)+'%';let c='rate-bad';if(n>=0.4)c='rate-good';else if(n>=0.1)c='rate-warn';return '<span class=\"'+c+'\">'+p+'</span>';}

let th = '<table><thead><tr><th>排名</th><th>战区</th><th>门店</th><th>专柜数</th><th>饱和承接人数(Q)</th><th>实际核销(R)</th><th>饱和度</th></tr></thead><tbody>';
STORE_DATA.forEach((s,i) => {
  th += '<tr><td>'+(i+1)+'</td><td class=\"text-left\">'+s.region+'</td><td class=\"text-left\"><strong>'+s.store+'</strong></td><td>'+s.counterCount+'</td><td class=\"text-right\">'+fmtNum(s.sumQ,0)+'</td><td class=\"text-right\">'+fmtNum(s.sumR,0)+'</td><td>'+pctHtml(s.saturation)+'</td></tr>';
});
th += '</tbody></table>';
document.getElementById('storeTable').innerHTML = th;

// ==================== CSV DOWNLOAD ====================
function downloadCSV(){
  var csv='﻿排名,战区,门店,专柜数,饱和承接人数,实际核销,饱和度\n';
  STORE_DATA.forEach(function(s,i){
    csv += (i+1)+',\"'+s.region+'\",\"'+s.store+'\",'+s.counterCount+','+s.sumQ+','+s.sumR+','+(s.saturation!=null?(s.saturation*100).toFixed(1)+'%':'')+'\n';
  });
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='门店饱和度排名_7.29期.csv';
  a.click();
}
</script>
</body>
</html>
